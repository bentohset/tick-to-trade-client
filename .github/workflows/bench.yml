name: Bench

# Run manually: Actions tab -> Bench -> Run workflow.
# Results (JSON + machine info) are uploaded as the "bench-results-<label>" artifact
# and summarized on the run page. Copy them into docs/design/results/<label>/ to keep them.

on:
  workflow_dispatch:
    inputs:
      label:
        description: Implementation label used in file names (e.g. v1, v2)
        required: true
        default: v1
      itch_bytes:
        description: >
          Bytes of the ITCH day to use, from the start. 0 = whole day (8.25 GB; needs
          >= 16 GB RAM, which public-repo runners have). Slices are cached between runs.
        required: true
        default: "0"
      repetitions:
        description: Google Benchmark repetitions (every one is kept in the JSON)
        required: true
        default: "5"

concurrency:
  group: bench
  cancel-in-progress: false

env:
  ITCH_DAY: "12302019"
  ITCH_URL: https://emi.nasdaq.com/ITCH/Nasdaq%20ITCH/12302019.NASDAQ_ITCH50.gz
  ITCH_FULL_SIZE: "8251407909"  # decompressed size of the whole day, used as an integrity check
  MACHINE: gha-x86

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Machine info
        run: |
          mkdir -p results
          {
            echo "runner: $RUNNER_NAME ($RUNNER_OS $RUNNER_ARCH)"
            uname -a
            lscpu
            free -h
            df -h .
            g++ --version | head -1
            cmake --version | head -1
            echo "tsc flags: $(grep -o -w 'constant_tsc\|nonstop_tsc' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          } | tee "results/$MACHINE-machine.txt"

      # The runner's disk is advertised as 14 GB: the whole day (8.25 GB) plus the
      # build doesn't leave much. Remove preinstalled toolchains this job never uses.
      - name: Free disk space
        if: inputs.itch_bytes == '0'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Only slices are cached: an 8.25 GB cache entry is slow to save and restore,
      # and needs extra disk for the archive. The whole day is re-downloaded instead.
      - name: Cache ITCH data
        id: cache
        if: inputs.itch_bytes != '0'
        uses: actions/cache@v4
        with:
          path: data/itch
          key: itch-${{ env.ITCH_DAY }}-${{ inputs.itch_bytes }}

      - name: Download ITCH data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/itch
          out="data/itch/$ITCH_DAY.NASDAQ_ITCH50"
          if [[ "${{ inputs.itch_bytes }}" == "0" ]]; then
            curl -fsSL --retry 5 "$ITCH_URL" | gunzip > "$out"
            [[ $(stat -c %s "$out") -eq $ITCH_FULL_SIZE ]] || { echo "unexpected size"; exit 1; }
          else
            # Stops the download once enough bytes are decompressed. head closing the
            # pipe makes curl/gunzip exit with SIGPIPE, which is expected here.
            set +o pipefail
            curl -fsSL --retry 5 "$ITCH_URL" | gunzip 2>/dev/null | head -c "${{ inputs.itch_bytes }}" > "$out"
            set -o pipefail
            [[ $(stat -c %s "$out") -eq "${{ inputs.itch_bytes }}" ]] || { echo "short download"; exit 1; }
          fi
          ls -l "$out"

      - name: Build (Release)
        run: ./build.sh --release --bench

      - name: Run benchmarks
        run: |
          F="data/itch/$ITCH_DAY.NASDAQ_ITCH50"
          L="${{ inputs.label }}"
          R=results
          # Pin to one core; the other handles the runner agent and OS
          PIN="taskset -c 1"

          $PIN build-release/bench/bench_itch_parse "$F" \
            --benchmark_repetitions=${{ inputs.repetitions }} --benchmark_display_aggregates_only=true \
            --benchmark_out="$R/parse-$MACHINE-bench.json" --benchmark_out_format=json | tee "$R/parse.txt"

          $PIN build-release/bench/bench_order_book "$F" \
            --benchmark_repetitions=${{ inputs.repetitions }} --benchmark_display_aggregates_only=true \
            --benchmark_out="$R/$L-$MACHINE-bench.json" --benchmark_out_format=json | tee "$R/book.txt"

          $PIN build-release/bench/latency_order_book "$F" --label "$L-$MACHINE" \
            > "$R/$L-$MACHINE-latency.json" 2> "$R/latency.txt"
          cat "$R/latency.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bench: ${{ inputs.label }} on $MACHINE (${{ inputs.itch_bytes }} bytes of $ITCH_DAY)"
            for f in parse book latency; do
              [[ -f "results/$f.txt" ]] || continue
              echo "### $f"
              echo '```'
              grep -v '^\*\*\*' "results/$f.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ inputs.label }}
          path: results/
